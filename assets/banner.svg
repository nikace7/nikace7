<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="60%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#111c33" />
    </linearGradient>

    <!-- Top Border Highlight Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="emeraldGlow" cx="90%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="blueGlow" cx="10%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.28" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="878" height="228" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.2" />
  
  <!-- Dot Grid Pattern Overlay -->
  <rect x="2" y="2" width="876" height="226" rx="15" fill="url(#dotGrid)" />
  
  <!-- Ambient Radial Glows -->
  <rect x="2" y="2" width="876" height="226" rx="15" fill="url(#emeraldGlow)" />
  <rect x="2" y="2" width="876" height="226" rx="15" fill="url(#blueGlow)" />

  <!-- Top Accent Glowing Border -->
  <path d="M 16 1 L 864 1" stroke="url(#borderGlow)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Status Pill (Top Left) -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="372" height="24" rx="12" fill="#064e3b" fill-opacity="0.55" stroke="#059669" stroke-width="0.9" />
    <circle cx="14" cy="12" r="4" fill="#34d399" />
    <text x="26" y="15.5" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="10.5" font-weight="600" fill="#a7f3d0" letter-spacing="0.06em">OPEN TO OPPORTUNITIES · KATHMANDU, NEPAL</text>
  </g>

  <!-- Hero Name -->
  <text x="32" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.035em">Nikesh Khatri</text>
  
  <!-- Role / Subtitle -->
  <text x="32" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, sans-serif" font-size="16" font-weight="500" fill="#38bdf8" letter-spacing="-0.01em">
    Software Engineer <tspan fill="#64748b">·</tspan> Multi-Tenant Architecture, Ledgers &amp; Production SaaS
  </text>

  <!-- Tagline / Philosophy -->
  <text x="32" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Building production systems where "roughly right" is wrong: ledgers that balance, payroll that matches tax law,
  </text>
  <text x="32" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    and database-level tenant isolation that never crosses shops.
  </text>

  <!-- Bottom Core Tech Chips -->
  <g transform="translate(32, 191)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect width="108" height="22" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
      <text x="54" y="14.5" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">Python / Django</text>
    </g>
    <!-- Chip 2 -->
    <g transform="translate(116, 0)">
      <rect width="112" height="22" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
      <text x="56" y="14.5" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">PostgreSQL RLS</text>
    </g>
    <!-- Chip 3 -->
    <g transform="translate(236, 0)">
      <rect width="124" height="22" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
      <text x="62" y="14.5" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">React &amp; TypeScript</text>
    </g>
    <!-- Chip 4 -->
    <g transform="translate(368, 0)">
      <rect width="132" height="22" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
      <text x="66" y="14.5" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">Double-Entry ERP</text>
    </g>
    <!-- Chip 5 -->
    <g transform="translate(508, 0)">
      <rect width="94" height="22" rx="6" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8" />
      <text x="47" y="14.5" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">Docker &amp; CI/CD</text>
    </g>
  </g>

  <!-- Right Decorative Architecture Diagram -->
  <g transform="translate(680, 48)" opacity="0.92">
    <!-- Outer boundary box -->
    <rect x="0" y="0" width="168" height="138" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <text x="14" y="18" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="9" font-weight="600" fill="#64748b" letter-spacing="0.05em">DATABASE RLS SCOPE</text>
    
    <!-- Central Tenant Router Node -->
    <rect x="36" y="32" width="96" height="26" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="84" y="48.5" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">Tenant Router</text>
    
    <!-- Connecting Lines -->
    <path d="M 54 58 L 54 82" stroke="#475569" stroke-width="1.2" />
    <path d="M 114 58 L 114 82" stroke="#475569" stroke-width="1.2" />
    
    <!-- Isolated Tenant Store 1 -->
    <rect x="18" y="82" width="62" height="42" rx="6" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="1.2" />
    <text x="49" y="99" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="9.5" font-weight="600" fill="#34d399" text-anchor="middle">Tenant A</text>
    <text x="49" y="113" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">Ledger · RLS</text>

    <!-- Isolated Tenant Store 2 -->
    <rect x="88" y="82" width="62" height="42" rx="6" fill="#1e1b4b" fill-opacity="0.5" stroke="#818cf8" stroke-width="1.2" />
    <text x="119" y="99" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="9.5" font-weight="600" fill="#a5b4fc" text-anchor="middle">Tenant B</text>
    <text x="119" y="113" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace" font-size="8" fill="#c7d2fe" text-anchor="middle">Ledger · RLS</text>
  </g>
</svg>